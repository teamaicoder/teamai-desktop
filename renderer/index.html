<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; frame-src file: 'self'"/>
  <title>TeamAICoder</title>
  <link rel="stylesheet" href="vendor/xterm.css"/>
  <link rel="stylesheet" href="vendor/codemirror.css"/>
  <link rel="stylesheet" href="vendor/toastui-editor.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div id="app">
    <!-- Top-level navigation -->
    <nav id="top-nav">
      <div class="nav-logo">TeamAICoder</div>
      <div class="nav-tabs">
        <button class="nav-tab" data-section="ideas">Ideas</button>
        <button class="nav-tab" data-section="design">Design</button>
        <button class="nav-tab" data-section="plan">Plan &amp; Track</button>
        <button class="nav-tab active" data-section="build">Build</button>
        <button class="nav-tab" data-section="test">Test</button>
        <button class="nav-tab" data-section="deploy">Deploy</button>
        <button class="nav-tab" data-section="operate">Operate</button>
      </div>
    </nav>

    <div class="divider-h"></div>

    <!-- Section panes -->
    <div id="section-container">

      <!-- Ideas (populated dynamically by FileBrowserSection) -->
      <div class="section-pane" id="section-ideas"></div>

      <!-- Design (populated dynamically by FileBrowserSection) -->
      <div class="section-pane" id="section-design"></div>

      <!-- Plan & Track (populated dynamically by FileBrowserSection) -->
      <div class="section-pane" id="section-plan"></div>

      <!-- Build (current view) -->
      <div class="section-pane active" id="section-build">
        <!-- Left sidebar -->
        <div id="sidebar">
          <div id="sidebar-header"></div>
          <div class="divider-h"></div>
          <div id="sidebar-toolbar" class="sidebar-toolbar"></div>
          <div id="sidebar-body">
            <div id="starred-section"></div>
            <div id="file-list"></div>
          </div>
        </div>

        <div class="divider-v"></div>

        <!-- Right panel -->
        <div id="right-panel">
          <div id="tab-bar"></div>
          <div class="divider-h" id="tab-bar-divider"></div>
          <div id="tab-content">
            <div id="empty-state">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14,2 14,8 20,8"/>
              </svg>
              <p>Select a file to preview</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Test (populated dynamically by FileBrowserSection) -->
      <div class="section-pane" id="section-test"></div>

      <!-- Deploy (populated dynamically by FileBrowserSection) -->
      <div class="section-pane" id="section-deploy"></div>

      <!-- Operate (populated dynamically by FileBrowserSection) -->
      <div class="section-pane" id="section-operate"></div>

    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="vendor/codemirror.js"></script>
  <script src="vendor/cm-modes/xml.js"></script>
  <script src="vendor/cm-modes/javascript.js"></script>
  <script src="vendor/cm-modes/css.js"></script>
  <script src="vendor/cm-modes/htmlmixed.js"></script>
  <script src="vendor/cm-modes/yaml.js"></script>
  <script src="vendor/cm-modes/python.js"></script>
  <script src="vendor/cm-modes/shell.js"></script>
  <script src="vendor/cm-modes/clike.js"></script>
  <script src="vendor/cm-modes/go.js"></script>
  <script src="vendor/cm-modes/ruby.js"></script>
  <script src="vendor/cm-simple.js"></script>
  <script src="vendor/cm-modes/rust.js"></script>
  <script src="vendor/cm-modes/toml.js"></script>
  <script src="vendor/toastui-editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
