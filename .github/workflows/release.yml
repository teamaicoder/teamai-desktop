name: Release

# Pushing a tag like v0.1.0 builds signed, notarised macOS apps for Apple
# silicon and Intel, tests each packaged app on a matching runner, and attaches
# them to a draft GitHub release. A maintainer reviews and publishes the draft.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (compiles node-pty for Electron)
        run: npm ci

      - name: Copy vendor assets
        run: npm run setup

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      # electron-builder's own CSC_LINK import unlocks its keychain with the
      # wrong password (26.8.x), so import into a job keychain here and let it
      # discover the identity.
      - name: Import the Developer ID certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the notarisation key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarise (Apple silicon and Intel)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist:release

      - name: Verify signatures and notarisation
        run: |
          for app in dist/mac-arm64/TeamAICoder.app dist/mac/TeamAICoder.app; do
            codesign --verify --deep --strict "$app"
            spctl -a -vvv -t exec "$app"
            xcrun stapler validate "$app"
          done

      - name: Test the packaged Apple silicon app
        env:
          TAC_EXECUTABLE: ${{ github.workspace }}/dist/mac-arm64/TeamAICoder.app/Contents/MacOS/TeamAICoder
        run: npx playwright test

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          retention-days: 14

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-arm64
          path: test-results/
          retention-days: 7

  test-intel:
    needs: build-mac
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: release

      - name: Unpack the Intel app
        run: |
          ditto -x -k release/TeamAICoder-*-mac-x64.zip "$RUNNER_TEMP/app"
          spctl -a -vvv -t exec "$RUNNER_TEMP/app/TeamAICoder.app"

      - name: Test the packaged Intel app
        run: TAC_EXECUTABLE="$RUNNER_TEMP/app/TeamAICoder.app/Contents/MacOS/TeamAICoder" npx playwright test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-intel
          path: test-results/
          retention-days: 7

  draft-release:
    needs: [build-mac, test-intel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes \
            --title "TeamAICoder ${GITHUB_REF_NAME#v}"
