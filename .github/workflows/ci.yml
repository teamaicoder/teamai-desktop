name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (compiles node-pty for Electron)
        run: npm ci

      - name: Copy vendor assets
        run: npm run setup

      - name: Unit tests
        timeout-minutes: 3
        run: npm test

      - name: UI tests (Playwright, Electron)
        timeout-minutes: 10
        run: npx playwright test

      - name: Build unsigned app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
